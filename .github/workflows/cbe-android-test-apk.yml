name: CBE Android direct-import test APK

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  android-test-apk:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/mobile-required-import-streaming-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested branch head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || { echo "sdkmanager missing at $SDKMANAGER"; find "$ANDROID_HOME" -name sdkmanager -type f -print; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build_android.sh mobile/android/gradlew
          scripts/build_android.sh --version 0.0.0

      - name: Stage test APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find dist/android/debug -type f -name '*.apk' | head -1)"
          [ -n "$apk" ] || { echo "No Android APK produced"; exit 1; }
          mkdir -p dist/cbe-android-test
          cp "$apk" dist/cbe-android-test/gen1recomp-cbe-mobile-import-test.apk
          sha256sum dist/cbe-android-test/gen1recomp-cbe-mobile-import-test.apk \
            > dist/cbe-android-test/gen1recomp-cbe-mobile-import-test.apk.sha256
          ls -lh dist/cbe-android-test

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: gen1recomp-cbe-mobile-import-test
          path: |
            dist/cbe-android-test/gen1recomp-cbe-mobile-import-test.apk
            dist/cbe-android-test/gen1recomp-cbe-mobile-import-test.apk.sha256
          if-no-files-found: error
          retention-days: 7
