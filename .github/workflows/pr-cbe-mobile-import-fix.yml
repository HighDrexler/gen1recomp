name: Build mobile required-import fix PR

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  build-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/mobile-required-import-streaming'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-required-import-streaming
          fetch-depth: 0

      - name: Normalize patch helper
        run: python3 tools/fix_mobile_patch_script.py

      - name: Apply patch
        run: python3 tools/apply_mobile_required_import_patch.py

      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit

      - name: Run targeted regression tests
        run: |
          luajit tests/rom_importer_android_mod_pick_test.lua
          luajit tests/engine/required_import_streaming_test.lua
          python3 -m py_compile mobile/ios/patch_love_src.py

      - name: Check native patch invariants
        run: |
          grep -q 'pick_complete.flag' mobile/android/love/src/main/java/org/love2d/android/GameActivity.java
          grep -q 'gen1recomp-required-import' mobile/android/love/src/main/java/org/love2d/android/GameActivity.java
          grep -q 'presentPickerWithKind:saveDir:destination:' mobile/ios/patch_love_src.py
          grep -q 'copyRequiredItemAsync' mobile/ios/native/GRPickerBridge.swift

      - name: Commit tested branch
        run: |
          rm tools/apply_mobile_required_import_patch.py
          rm tools/fix_mobile_patch_script.py
          rm .github/workflows/cbe-mobile-required-import-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "mobile: stream raw required imports directly from native pickers"
          git push origin HEAD:fix/mobile-required-import-streaming
